<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitPilot · Your next stronger</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#202b27;font:15px system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:3px solid #e8ae62}button:hover{filter:brightness(.96)}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{background:#112e26;color:#d0dbd4;padding:36px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.logo{font-size:30px;font-weight:800;letter-spacing:-1.5px;color:white;padding:0 13px}.logo i{color:#d8f684;font-style:normal}.caption{font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.6;margin:8px 14px 35px}nav{display:grid;gap:7px}nav button{text-align:left;background:none;color:#bdcdc4;padding:14px;border-radius:9px}nav button.active{background:#d8f684;color:#163b2b;font-weight:700}.navicon{display:inline-block;width:28px;font-size:19px}.asidebottom{margin-top:auto;font-size:12px;line-height:1.8;padding:15px}.avatar{width:37px;height:37px;border-radius:50%;background:#e7e8d6;display:inline-grid;place-items:center;color:#254b3a;font-weight:700}.main{padding:25px 4vw 45px;max-width:1600px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dddfd6;padding-bottom:23px;gap:15px}.mode{display:flex;background:#e9ebe2;border-radius:30px;padding:4px}.mode button{padding:9px 17px;border-radius:25px;background:none;font-size:12px}.mode button.selected{background:#173e30;color:white}.badge{font-size:11px;border-radius:20px;background:#e8ecd9;padding:6px 10px;color:#476045}.topright{display:flex;align-items:center;gap:13px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#738172;font-weight:650}h1{font-size:37px;font-weight:550;letter-spacing:-1.4px;margin:8px 0}h2{font-size:20px;font-weight:600;letter-spacing:-.5px;margin:0 0 12px}h3{margin:0 0 8px;font-size:16px}p{line-height:1.6}.muted{color:#7b857c;font-size:13px}.heading{display:flex;justify-content:space-between;align-items:center;margin:33px 0 25px}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:22px}.card{background:#fff;border:1px solid #e3e6dc;border-radius:17px;padding:25px;margin-bottom:20px}.hero{background:#183e30;color:white;position:relative;overflow:hidden;min-height:260px}.hero h2{font-size:32px;max-width:310px;letter-spacing:-1px}.hero .muted{color:#bacabc}.heroart{position:absolute;right:20px;top:25px;width:160px;height:200px;opacity:.6;transform:rotate(-20deg)}.heroart:before,.heroart:after{content:'';position:absolute;border:18px solid #a3bb80;border-radius:70px;width:85px;height:150px}.heroart:after{left:65px;top:35px}.hero>*:not(.heroart){position:relative;z-index:1}.btn{background:#d8f684;color:#173c2c;padding:12px 18px;border-radius:9px;font-weight:650;font-size:13px}.btn.dark{background:#183e30;color:white}.btn.outline{background:transparent;border:1px solid #d6ddcf;color:#344d40}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.stat{border:1px solid #e2e5da;background:white;border-radius:14px;padding:20px}.stat b{font-size:26px;display:block;margin:10px 0 4px;font-weight:600;letter-spacing:-1px}.stat small{color:#71935a;font-size:11px}.ring{width:120px;height:120px;border-radius:50%;background:conic-gradient(#426d48 0 65%,#eef0e6 65%);display:grid;place-items:center;flex-shrink:0}.ring>div{background:white;width:98px;height:98px;border-radius:50%;display:grid;place-content:center;text-align:center}.ring b{font-size:25px}.bar{height:6px;background:#edf0e6;border-radius:10px;margin:8px 0 14px;overflow:hidden}.bar>i{height:100%;display:block;background:#799763;border-radius:10px}.item{padding:17px 0;border-bottom:1px solid #edf0e9}.item:last-child{border:0}.square{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#eef1e2;font-size:21px;flex-shrink:0}.flex{display:flex;align-items:center;gap:13px}.tiny{font-size:11px}.week{display:flex;justify-content:space-between;margin:16px 0}.day{text-align:center;border-radius:25px;padding:10px 13px;background:#f2f4eb;font-size:12px;line-height:2}.day.on{background:#d8f684}.textbtn{background:none;color:#315a3b;font-weight:600;font-size:12px;padding:8px}.pill{padding:5px 9px;font-size:10px;background:#edf3e6;color:#4c7146;border-radius:20px}.chart{height:150px;display:flex;align-items:flex-end;gap:12px;padding-top:20px}.chart div{flex:1;border-radius:6px 6px 0 0;background:#cbdcb9;position:relative}.chart div:nth-child(5){background:#42674d}.chart span{position:absolute;bottom:-23px;left:25%;font-size:10px;color:#879180}.notice{padding:12px 16px;background:#eceee4;border-radius:9px;font-size:12px;color:#65715e;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0;font-size:12px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9ded1;background:#fafbf7;border-radius:8px;color:#263e2e}.switch{background:#3a6749;border-radius:15px;padding:3px;width:43px;height:25px}.switch:after{content:'';display:block;width:19px;height:19px;border-radius:50%;background:white;margin-left:18px}.switch.off{background:#bdc5b7}.switch.off:after{margin:0}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:16px 9px;border-bottom:1px solid #ecede6;font-size:13px}.table th{font-size:10px;text-transform:uppercase;color:#85907f;letter-spacing:1px}.modalwrap{position:fixed;inset:0;background:#132d2580;z-index:5;display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}.modal{background:white;border-radius:20px;padding:28px;max-width:510px;width:100%;max-height:90vh;overflow:auto}.close{float:right;border:0;background:#f1f3ec;border-radius:50%;width:30px;height:30px}.hidden{display:none!important}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#183e30;color:white;border-radius:10px;padding:14px 23px;z-index:10;font-size:13px}.upload{border:1px dashed #adbd9d;border-radius:12px;padding:25px;background:#f6f8ef;text-align:center}.messages{min-height:170px}.bubble{background:#eff3e7;padding:12px 16px;border-radius:14px;margin:12px 0;max-width:90%;font-size:13px}.bubble.mine{background:#1b4433;color:white;margin-left:auto}.demofigure{height:140px;background:#edf2e3;border-radius:10px;display:grid;place-items:center}.person{font-size:70px;animation:lift 1.5s ease-in-out infinite}@keyframes lift{50%{transform:translateY(13px) scaleY(.88)}}@media(prefers-reduced-motion:reduce){.person{animation:none}}@media(max-width:900px){.shell{grid-template-columns:75px 1fr}aside{padding:28px 10px}.logo{font-size:21px;padding:0}.logo span,.caption,.navlabel,.asidebottom{display:none}nav{margin-top:40px}nav button{padding:12px;text-align:center}.navicon{width:auto}.grid{grid-template-columns:1fr}.main{padding:20px}.heroart{right:30px}}@media(max-width:550px){.shell{display:block}aside{height:auto;position:fixed;top:auto;bottom:0;width:100%;z-index:3;padding:8px;background:#12382b}aside .logo{display:none}nav{display:flex;margin:0;justify-content:space-around;overflow:auto}nav button{padding:8px 12px}nav .navlabel{display:block;font-size:8px;margin-top:4px}.main{padding:18px 16px 95px}.top{align-items:flex-start}.topright .badge,.topright .avatar{display:none}.heading{margin-top:24px}h1{font-size:29px}.stats{gap:8px}.stat{padding:13px}.stat b{font-size:23px}.heroart{right:-30px}.card{padding:19px}.mode button{padding:8px 12px}.table td,.table th{padding:12px 4px;font-size:11px}}
</style></head><body><div class="shell"><aside><div class="logo">fitpilot<i>→</i></div><div class="caption">Your next stronger</div><nav id="nav"></nav><div class="asidebottom"><span class="avatar">AK</span><p>Arjun K.<br><span style="opacity:.6">Complete coaching</span></p><span class="pill">Interactive prototype</span></div></aside><main class="main"><header class="top"><div><strong id="space">Your personal coaching space</strong><div class="muted tiny" style="margin-top:5px">Wednesday, 4 November · Sample day</div></div><div class="topright"><div class="mode"><button id="clientMode" onclick="mode('client')">Client app</button><button id="coachMode" onclick="mode('coach')">Trainer</button></div><span class="badge">DEMO</span><span class="avatar">AK</span></div></header><div id="content"></div><div class="notice">Clickable prototype · Fictional sample data. Payments, wearable sync, food analysis and messages are simulated. Changes stay in this browser.</div></main></div><div id="modal" class="modalwrap hidden"></div><div id="toast" class="toast hidden" role="status"></div><script>
const $=s=>document.querySelector(s);const saved=JSON.parse(localStorage.getItem('fitpilotDemo')||'{}');let state={role:'client',page:'Today',logged:false,meal:false,auto:true,...saved};const persist=()=>localStorage.setItem('fitpilotDemo',JSON.stringify(state));const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={Today:'◈',Train:'→',Nutrition:'◉',Progress:'▥',Coach:'☏',Overview:'◈',Clients:'♧',Plans:'▤',Automations:'ϟ',Business:'▦'};
function mode(r){state.role=r;state.page=r==='client'?'Today':'Overview';render()}function go(p){state.page=p;render()}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3000)}function closeModal(){$('#modal').classList.add('hidden')}function modal(t,body){$('#modal').innerHTML=`<section class="modal"><button class="close" aria-label="Close" onclick="closeModal()">×</button><h2>${t}</h2>${body}</section>`;$('#modal').classList.remove('hidden')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function heading(k,t,sub,action=''){return `<div class="heading"><div><div class="eyebrow">${k}</div><h1>${t}</h1><div class="muted">${sub}</div></div>${action}</div>`}function bar(label,value,p){return `<div class="row tiny"><span>${label}</span><b>${value}</b></div><div class="bar"><i style="width:${p}%"></i></div>`}function stat(label,val,sub){return `<div class="stat"><span class="muted">${label}</span><b>${val}</b><small>${sub}</small></div>`}function item(icon,title,sub,right=''){return `<div class="item row"><div class="flex"><span class="square">${icon}</span><div><h3>${title}</h3><div class="muted">${sub}</div></div></div>${right}</div>`}function chart(){return `<div class="chart">${[45,61,53,75,91,71,84].map((n,i)=>`<div style="height:${n}%"><span>${['M','T','W','T','F','S','S'][i]}</span></div>`).join('')}</div><div style="height:20px"></div>`}
function nutritionCard(){return `<div class="card"><div class="row"><h2>Fuel your progress</h2><button class="textbtn" onclick="go('Nutrition')">View diary →</button></div><div class="flex" style="gap:25px;margin:16px 0 22px"><div class="ring"><div><b>${state.meal?'1,802':'1,320'}</b><span class="tiny muted">of 2,100 kcal</span></div></div><div style="flex:1">${bar('Protein',state.meal?'112 / 140 g':'84 / 140 g',state.meal?80:60)}${bar('Carbs','156 / 240 g',65)}${bar('Fat','40 / 65 g',62)}</div></div><button class="btn outline" style="width:100%" onclick="food()">＋ Log a meal</button></div>`}
function today(){return heading('Small steps. Stronger you.','Let’s make today count, Arjun.','Your plan is ready. Show up for yourself.')+`<div class="grid"><div><div class="card hero"><div class="heroart"></div><div class="eyebrow" style="color:#d8f684">TODAY’S WORKOUT · WEEK 04</div><h2 style="margin-top:20px">Build strength.<br>Find your rhythm.</h2><p class="muted">Upper body strength · 45 min · 6 exercises</p><button class="btn" onclick="workout()">${state.logged?'Review workout':'Start your workout'} →</button></div><div class="stats">${stat('Steps','7,842','78% of daily goal')}${stat('Sleep','7h 24m','↑ 32 min this week')}${stat('Consistency','86%','6 of 7 planned sessions')}</div><div class="card"><div class="row"><h2>Your week, in motion</h2><span class="pill">Week 04</span></div><div class="week">${['M ✓','T ✓','W 04','T 05','F 06','S 07','S 08'].map((d,i)=>`<div class="day ${i===2?'on':''}">${d.split(' ')[0]}<br><b>${d.split(' ')[1]}</b></div>`).join('')}</div><div class="muted">Strength today · Recovery tomorrow · Keep your momentum.</div></div></div><div>${nutritionCard()}<div class="card"><div class="eyebrow">A LITTLE ACCOUNTABILITY</div><h2 style="margin-top:12px">Your coach is in your corner.</h2><p class="muted">“Good progress on your rows last week. Keep the movement controlled and finish strong today.”</p><button class="textbtn" onclick="go('Coach')">Message your coach →</button></div><div class="card">${item('◷','Weekly review','Tomorrow · 6:30 PM · 30 min',`<button class="textbtn" onclick="booking()">Details</button>`)}</div></div></div>`}
const exercises=['Dumbbell bench press','One-arm dumbbell row','Seated shoulder press','Lat pulldown','Cable triceps extension','Dumbbell curl'];
function train(){return heading('Your programme','Train with intention.','Strength foundations · Week 4 of 12')+`<div class="grid"><div class="card"><div class="row"><h2>Upper body strength</h2><button class="btn dark" onclick="workout()">${state.logged?'Review':'Start'} session</button></div>${exercises.map((x,i)=>item(String(i+1).padStart(2,'0'),x,'3 sets × 10–12 reps · 60 sec rest',`<button class="textbtn" onclick="demo(${i})">Demo →</button>`)).join('')}</div><div><div class="card"><h2>Your training split</h2>${item('M','Upper body','Completed','✓')}${item('T','Lower body','Completed','✓')}${item('W','Upper body','Today',`<span class="pill">${state.logged?'Complete':'Ready'}</span>`) }${item('T','Active recovery','Walk & mobility')}</div><div class="notice">Exercise visuals are schematic placeholders in this prototype. Final demos will use trainer-approved footage.</div></div></div>`}
function demo(i){modal(exercises[i],`<div class="demofigure"><div class="person">🏋</div></div><p class="muted">Motion placeholder—not an instructional demonstration.</p><p>3 sets · 10–12 reps · 60 seconds rest</p><p class="muted">Your trainer’s approved video and technique cues will appear here.</p><button class="btn dark" onclick="workout()">Open workout log</button>`)}
function workout(){modal('Upper body · workout log',`<p class="muted">Dumbbell bench press · Previous: 12 kg × 10 reps</p><div class="notice">Prototype: log the opening exercise to complete this sample session.</div>${[1,2,3].map(n=>`<div class="row"><b class="tiny">SET ${n}</b><label class="field">Weight (kg)<input type="number" min="0" value="12" aria-label="Set ${n} weight"></label><label class="field">Reps<input type="number" min="0" value="10" aria-label="Set ${n} reps"></label></div>`).join('')}<button class="btn dark" onclick="state.logged=true;persist();closeModal();render();toast('Sample workout saved — nice work!')">Complete sample session ✓</button>`)}
function food(){modal('Log a meal',`<p class="muted">Photo + description → confirm portion → save.</p><div class="upload"><span style="font-size:25px">◎</span><p>Upload your meal photo</p><input type="file" accept="image/*" aria-label="Meal photo" onchange="$('#photoStatus').textContent=this.files[0]?'Photo selected locally':''"><div id="photoStatus" class="muted"></div></div><label class="field">Describe your meal<textarea id="mealdesc">2 dosas, coconut chutney and a 2-egg omelette</textarea></label><button class="btn dark" onclick="foodResult()">Preview sample estimate →</button><p class="tiny muted">Demo only: no photo is uploaded or analysed.</p>`)}
function foodResult(){modal('Confirm your meal',`<span class="pill">Illustrative estimate · not database verified</span><p>Sample result for dosas, chutney and omelette. Values do not change based on the uploaded photo.</p><p class="muted">Sample serving: 2 dosas, chutney and a 2-egg omelette.</p><div class="stats">${stat('Calories','<span id="cal">482</span>','kcal')}${stat('Protein','28 g','sample')}${stat('Carbs','51 g','sample')}</div><p class="muted">Fat: 18 g at the sample serving. Confirm ingredients and oil in the production app.</p><button class="btn dark" onclick="state.meal=true;persist();closeModal();render();toast('Sample meal added to diary')">Save sample meal</button>`)}
function nutrition(){return heading('Nourish your routine','Good fuel. Better days.','Your personalised nutrition plan and food diary.',`<button class="btn dark" onclick="food()">＋ Log meal</button>`)+`<div class="grid"><div>${nutritionCard()}<div class="card"><h2>Today’s food diary</h2>${item('☀','Breakfast','Oats, banana & eggs · 420 kcal')}${item('◉','Lunch','Rice, grilled fish & vegetables · 620 kcal')}${item('◌','Snack','Greek yoghurt & fruit · 280 kcal')}${state.meal?item('✓','Sample meal logged','Dosas, chutney & omelette · 482 kcal'):''}</div></div><div><div class="card"><div class="eyebrow">TRAINER-ASSIGNED PLAN</div><h2 style="margin-top:12px">Balanced strength</h2><p class="muted">Daily target: 2,100 kcal<br>Protein: 140 g · Carbs: 240 g · Fat: 65 g</p><h3>Dinner suggestion</h3><p class="muted">Chapati, chicken curry and vegetables. Follow the portions assigned by your coach.</p><button class="btn outline" onclick="go('Coach')">Discuss your plan</button></div><div class="notice">Photo estimates need portion confirmation. Cronometer / MyFitnessPal access is not connected or approved in this prototype.</div></div></div>`}
function progress(){return heading('See how far you’ve come','Progress beyond the scale.','Your weekly picture, all in one place.')+`<div class="stats">${stat('Workout adherence','86%','↑ 12% this month')}${stat('Nutrition adherence','79%','Based on sample logs')}${stat('Body weight','74.2 kg','From 76.0 kg')}</div><div class="grid"><div class="card"><div class="row"><h2>Weekly activity</h2><span class="pill">Sample steps</span></div>${chart()}<div style="margin-top:20px">${bar('Workout adherence','6 of 7',86)}${bar('Nutrition adherence','Logged target days',79)}</div></div><div class="card"><h2>Connected health</h2>${item('♡','Apple Health','Demo source · synced 10 min ago',`<span class="pill">Sample</span>`)}${item('◷','Sleep','7h 24m · sample night')}${item('→','Workout duration','45 minutes')}${item('♡','Average heart rate','124 bpm · sample session')}<button class="btn outline" onclick="modal('Wearable connections','<p>Apple Health and Android Health Connect are planned. Additional brands depend on provider access.</p><p class=muted>No device is connected in this prototype. You will choose what to share with your trainer.</p>')">Manage connections</button></div></div>`}
function booking(){modal('Weekly coaching review',`<p>One-to-one video session · 30 minutes</p><label class="field">Choose a sample time<select id="slot"><option>Thursday · 6:30 PM</option><option>Friday · 7:00 PM</option><option>Saturday · 10:00 AM</option></select></label><p class="muted">3 of 4 sessions remaining in your package.</p><button class="btn dark" onclick="state.slot=$('#slot').value;persist();closeModal();render();toast('Sample session rescheduled')">Confirm time</button>`)}
function coach(){return heading('Real support, every step','Your coach, closer.','Messages, check-ins and live coaching.')+`<div class="grid"><div class="card"><div class="flex"><span class="avatar">C</span><div><h2>Your coach</h2><span class="muted">Sample conversation</span></div></div><div class="messages" id="messages"><div class="bubble">Hey Arjun! How did your last session feel? Send me a form video if you’d like feedback.</div><div class="bubble mine">Feeling stronger this week. Thank you!</div></div><form onsubmit="event.preventDefault();sendMessage()" class="flex"><input id="message" aria-label="Message coach" placeholder="Write a message…" style="flex:1;min-width:0;padding:13px;border:1px solid #dce1d5;border-radius:9px" required><button class="btn dark">Send →</button></form><p class="tiny muted">Messages stay in this preview; nothing is sent to a trainer.</p></div><div><div class="card"><h2>Next live session</h2><p>${escape(state.slot||'Thursday · 6:30 PM')}<br><span class="muted">Weekly review · 30 minutes</span></p><button class="btn outline" onclick="booking()">Reschedule</button></div><div class="card"><h2>Weekly check-in</h2><p class="muted">Share your energy, sleep and wins with your coach.</p><button class="btn dark" onclick="checkin()">Complete check-in</button></div></div></div>`}
function sendMessage(){const t=$('#message').value.trim();if(!t)return;$('#messages').insertAdjacentHTML('beforeend',`<div class="bubble mine">${escape(t)}</div>`);$('#message').value='';toast('Added to sample conversation')}
function checkin(){modal('Your weekly check-in',`<label class="field">Energy this week<select><option>Good — ready to train</option><option>Moderate</option><option>Low — need support</option></select></label><label class="field">Average sleep (hours)<input type="number" min="0" max="24" value="7"></label><label class="field">A win or challenge<textarea placeholder="What would you like your coach to know?"></textarea></label><button class="btn dark" onclick="closeModal();toast('Sample check-in submitted')">Submit check-in</button>`)}
function overview(){return heading('FITPILOT COACH','More coaching. Less admin.','Here’s what needs your attention today.',`<button class="btn dark" onclick="go('Clients')">View clients →</button>`)+`<div class="stats">${stat('Active clients','24','3 new this month')}${stat('Average adherence','84%','↑ 8% this month')}${stat('Monthly collections','₹72,000','Sample payment data')}</div><div class="grid"><div class="card"><div class="row"><h2>Your attention matters</h2><span class="pill">3 to review</span></div>${item('AK','Arjun K.','Weekly check-in ready',`<button class="textbtn" onclick="clientDetail('Arjun K.')">Review →</button>`)}${item('NM','Neha M.','Missed two planned sessions',`<button class="textbtn" onclick="clientDetail('Neha M.')">Review →</button>`)}${item('RS','Rahul S.','Package expires in 5 days',`<button class="textbtn" onclick="go('Business')">Renew →</button>`)}</div><div class="card"><h2>Today’s calendar</h2>${item('16','Anjali · Form review','4:00 PM · 30 min')}${item('18','Arjun · Live coaching','6:30 PM · 45 min')}<button class="textbtn" onclick="go('Business')">Open business dashboard →</button></div></div><div class="card"><div class="row"><h2>Consistency across your clients</h2><span class="muted">Last 7 days · sample data</span></div>${chart()}</div>`}
function clients(){return heading('Your coaching community','People before numbers.','Open a client to review their programme and progress.')+`<div class="card"><label class="field">Search clients<input id="search" placeholder="Search by name…" oninput="filterClients(this.value)"></label><table class="table"><thead><tr><th>Client</th><th>Package</th><th>Adherence</th><th></th></tr></thead><tbody id="clientRows"></tbody></table></div>`}
const people=['Arjun K.','Neha M.','Rahul S.','Anjali P.'];function filterClients(q=''){$('#clientRows').innerHTML=people.filter(n=>n.toLowerCase().includes(q.toLowerCase())).map((n,i)=>`<tr><td><strong>${n}</strong></td><td>Complete coaching</td><td>${[86,62,91,88][i]}%</td><td><button class="textbtn" onclick="clientDetail('${n}')">Open →</button></td></tr>`).join('')}
function clientDetail(n){modal(n,`<span class="pill">Complete coaching · Week 04</span><p>Workout adherence: 86%<br>Nutrition adherence: 79%<br>Average sleep: 7h 24m<br>Daily steps: 7,842</p><label class="field">Trainer note<textarea id="note" placeholder="Add a private coaching note"></textarea></label><div class="row"><button class="btn dark" onclick="closeModal();toast('Sample coaching note saved')">Save note</button><button class="btn outline" onclick="packageForm()">Customise package</button></div>`)}
function plans(){return heading('Build once. Coach personally.','Your programme library.','Reusable plans, customised for each client.',`<button class="btn dark" onclick="planForm()">＋ Create plan</button>`)+`<div class="grid"><div class="card"><h2>Workout programmes</h2>${['Strength foundations','Home essentials','Hypertrophy · Upper / lower',...(state.plan?[state.plan]:[])].map((x,i)=>item('▤',escape(x),i===0?'12 weeks · 4 sessions / week':'Trainer template',`<button class="textbtn" onclick="assign()">Assign →</button>`)).join('')}</div><div class="card"><h2>Exercise library</h2><p class="muted">Attach your own approved demonstrations to every exercise.</p>${exercises.slice(0,3).map((x,i)=>item('→',x,'Video placeholder',`<button class="textbtn" onclick="demo(${i})">View</button>`)).join('')}<button class="btn outline" onclick="modal('Add exercise video','<label class=field>Exercise name<input placeholder="e.g. Goblet squat"></label><label class=field>Video file<input type=file accept="video/*"></label><p class=muted>Prototype upload selection only; files are not sent to a server.</p><button class="btn dark" onclick="closeModal();toast(\'Sample exercise prepared\')">Save sample</button>')">＋ Add exercise</button></div></div>`}
function planForm(){modal('Create workout template',`<label class="field">Plan name<input id="planName" placeholder="e.g. Beginner strength"></label><label class="field">Duration<select><option>4 weeks</option><option>8 weeks</option><option>12 weeks</option></select></label><button class="btn dark" onclick="state.plan=$('#planName').value.trim()||'New strength plan';persist();closeModal();render()">Save template</button>`)}function assign(){modal('Assign programme',`<label class="field">Choose client<select>${people.map(n=>`<option>${n}</option>`).join('')}</select></label><label class="field">Start date<input type="date" value="2026-11-09"></label><button class="btn dark" onclick="closeModal();toast('Sample programme assigned')">Assign programme</button>`)}
function automations(){return heading('Personal touch. On repeat.','Your coaching autopilot.','You write the message. Set when it should arrive.',`<button class="btn dark" onclick="automationForm()">＋ New automation</button>`)+`<div class="grid"><div><div class="card"><div class="row"><div><h2>${escape(state.autoTitle||'A gentle workout nudge')}</h2><span class="pill">${escape(state.autoTrigger||'Workout remains incomplete')} → ${escape(state.autoTime||'19:00')}</span></div><button class="switch ${state.auto?'':'off'}" aria-label="Toggle workout reminder" aria-pressed="${state.auto}" onclick="state.auto=!state.auto;persist();render()"></button></div><p class="muted">${escape(state.autoText||'Hey {first_name}, there’s still time to show up for yourself. Your workout is waiting whenever you’re ready.')}</p><div class="row"><span class="tiny muted">All active clients · Push + in-app</span><button class="textbtn" onclick="automationForm()">Edit →</button></div></div><div class="card">${item('♡','Welcome to the team','When a client joins · In-app',`<span class="pill">Active</span>`)}${item('◷','Time to renew','5 days before expiry · Push',`<span class="pill">Active</span>`)}</div></div><div class="card"><h2>Thoughtful by default</h2><p class="muted">Respect the client’s local time and keep reminders useful.</p>${bar('Quiet hours','9 PM – 8 AM',100)}<p class="muted">One reminder per trigger per day.<br>Clients can opt out of optional notifications.</p><div class="notice">Automations are visual simulations. No notifications are scheduled or delivered.</div></div></div>`}
function automationForm(){modal('Build an automation',`<label class="field">Name<input id="autoName" value="${escape(state.autoTitle||'A gentle workout nudge')}"></label><label class="field">Trigger<select id="autoTrigger"><option>Workout remains incomplete</option><option>Weekly check-in overdue</option><option>Package expires in 5 days</option></select></label><label class="field">Send at client’s local time<input id="autoTime" type="time" value="${escape(state.autoTime||'19:00')}"></label><label class="field">Message<textarea id="autoText">${escape(state.autoText||'Hey {first_name}, your workout is ready. You’ve got this!')}</textarea></label><button class="btn dark" onclick="state.autoTrigger=$('#autoTrigger').value;state.autoTime=$('#autoTime').value;state.autoTitle=$('#autoName').value;state.autoText=$('#autoText').value;persist();closeModal();render();toast('Sample automation saved')">Save automation</button>`)}
function business(){return heading('Flexible coaching, clear business.','Packages that fit your people.','Manage offers, sessions and payments in one place.',`<button class="btn dark" onclick="packageForm()">＋ Custom package</button>`)+`<div class="stats">${stat('Collected this month','₹72,000','Sample transactions')}${stat('Upcoming renewals','4','Within 7 days')}${stat('Live sessions','12','Scheduled this week')}</div><div class="grid"><div class="card"><h2>Coaching packages</h2>${item('→','Complete coaching','12 weeks · Workout + diet + 4 live sessions',`<button class="textbtn" onclick="packageForm()">Customise</button>`)}${item('▤','Workout + nutrition','4 weeks · Weekly check-in',`<button class="textbtn" onclick="packageForm()">Customise</button>`)}${state.package?item('✓',escape(state.package.name),escape(state.package.client)+' · ₹'+escape(state.package.price),'<span class="pill">Draft</span>'):''}</div><div class="card"><h2>Recent payments</h2>${item('✓','Arjun K.','Complete coaching','₹6,000')}${item('✓','Anjali P.','Live coaching','₹4,000')}<div class="notice">Payment preview only. Razorpay and store billing must be configured according to package type before launch.</div></div></div>`}
function packageForm(){modal('Personalise a package',`<label class="field">Client<select id="pkgClient">${people.map(n=>`<option>${n}</option>`).join('')}</select></label><label class="field">Package name<input id="pkgName" value="Complete coaching"></label><div class="row"><label class="field">Price (₹)<input type="number" id="pkgPrice" value="6000" min="0"></label><label class="field">Duration (weeks)<input type="number" value="12" min="1"></label></div><label class="field">Included services<select><option>Workout + diet + 4 live sessions</option>Workout + diet</option>One-to-one live coaching</option>Workout only</option></select></label><button class="btn dark" onclick="state.package={name:$('#pkgName').value,client:$('#pkgClient').value,price:$('#pkgPrice').value};persist();closeModal();render();toast('Custom package saved as sample draft')">Save draft package</button>`)}
function render(){const pages=state.role==='client'?['Today','Train','Nutrition','Progress','Coach']:['Overview','Clients','Plans','Automations','Business'];if(!pages.includes(state.page))state.page=pages[0];$('#nav').innerHTML=pages.map(p=>`<button class="${state.page===p?'active':''}" onclick="go('${p}')"><span class="navicon">${icons[p]}</span><span class="navlabel">${p}</span></button>`).join('');$('#clientMode').className=state.role==='client'?'selected':'';$('#coachMode').className=state.role==='coach'?'selected':'';$('#space').textContent=state.role==='client'?'Your personal coaching space':'FitPilot Coach · Your workspace';$('#content').innerHTML=({Today:today,Train:train,Nutrition:nutrition,Progress:progress,Coach:coach,Overview:overview,Clients:clients,Plans:plans,Automations:automations,Business:business}[state.page])();if(state.page==='Clients')filterClients();persist()}render();
</script></body></html>
